security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # The accounts are files in var/users (App\Account\AccountStore).
    providers:
        accounts:
            id: App\Account\AccountStore

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            lazy: true
            provider: accounts
            form_login:
                login_path: login
                check_path: login
                username_parameter: email
                password_parameter: password
                enable_csrf: true
                default_target_path: home
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000
                always_remember_me: true
            logout:
                path: logout
                target: login
            login_throttling:
                max_attempts: 5

    access_control:
        - { path: ^/(entrar|registro)$, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
